<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid-d" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
    <!-- Accent line gradient -->
    <linearGradient id="accent-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#888"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <!-- Scan line gradient -->
    <linearGradient id="scan-d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0.03)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="55%" stop-color="rgba(255,255,255,0.03)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <!-- Marker cross -->
    <symbol id="mark-d" viewBox="0 0 12 12">
      <line x1="6" y1="0" x2="6" y2="12" stroke="#444" stroke-width="0.5"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#444" stroke-width="0.5"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="320" fill="#0d0d0d"/>
  <rect width="900" height="320" fill="url(#grid-d)" opacity="0.6"/>
  
  <!-- Architectural construction lines -->
  <line x1="80" y1="0" x2="80" y2="320" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="820" y1="0" x2="820" y2="320" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="0" y1="60" x2="900" y2="60" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="0" y1="260" x2="900" y2="260" stroke="#1a1a1a" stroke-width="0.5"/>
  
  <!-- Alignment markers -->
  <use href="#mark-d" x="74" y="54" width="12" height="12"/>
  <use href="#mark-d" x="814" y="54" width="12" height="12"/>
  <use href="#mark-d" x="74" y="254" width="12" height="12"/>
  <use href="#mark-d" x="814" y="254" width="12" height="12"/>
  
  <!-- Coordinate labels -->
  <text x="72" y="50" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#333" text-anchor="end">0,0</text>
  <text x="828" y="50" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#333">1,0</text>
  <text x="72" y="275" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#333" text-anchor="end">0,1</text>
  <text x="828" y="275" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#333">1,1</text>
  
  <!-- Top accent line with animation -->
  <line x1="80" y1="60" x2="820" y2="60" stroke="url(#accent-d)" stroke-width="0.75"/>
  
  <!-- Animated scan line -->
  <rect x="80" y="60" width="740" height="200" fill="url(#scan-d)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -200;0 200;0 -200" dur="6s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Name -->
  <text x="450" y="132" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="300" fill="#f0f0f0" text-anchor="middle" letter-spacing="16">ISA SHAIKH</text>
  
  <!-- Divider line with drawing animation -->
  <line x1="320" y1="152" x2="580" y2="152" stroke="#555" stroke-width="0.5">
    <animate attributeName="x1" from="450" to="320" dur="1.5s" fill="freeze"/>
    <animate attributeName="x2" from="450" to="580" dur="1.5s" fill="freeze"/>
  </line>
  
  <!-- Tagline -->
  <text x="450" y="180" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="11" fill="#777" text-anchor="middle" letter-spacing="4">SOFTWARE, BUILT WITH INTENT</text>
  
  <!-- Subtitle -->
  <text x="450" y="210" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" letter-spacing="1">Engineering Student · Independent Developer · Elyaro Labs</text>
  
  <!-- Bottom accent line -->
  <line x1="80" y1="260" x2="820" y2="260" stroke="url(#accent-d)" stroke-width="0.75"/>
  
  <!-- Bottom marginal note -->
  <text x="820" y="290" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#333" text-anchor="end">est. MMXXIV — mobile · backend · web</text>
  
  <!-- Geometric accent — subtle orbital arc -->
  <path d="M 140 160 Q 200 80, 280 140" stroke="#2a2a2a" stroke-width="0.5" fill="none">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M 760 160 Q 700 240, 620 180" stroke="#2a2a2a" stroke-width="0.5" fill="none">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="2s"/>
  </path>
  
  <!-- Small precision dots at line intersections -->
  <circle cx="80" cy="60" r="1.5" fill="#444"/>
  <circle cx="820" cy="60" r="1.5" fill="#444"/>
  <circle cx="80" cy="260" r="1.5" fill="#444"/>
  <circle cx="820" cy="260" r="1.5" fill="#444"/>
</svg>
