<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid-pattern-dark" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141824" stroke-width="0.5"/>
      <circle cx="40" cy="40" r="0.75" fill="#222A3B"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="gold-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>

    <linearGradient id="beam-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E5C07B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyan-accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5E80"/>
      <stop offset="50%" stop-color="#7E97C4"/>
      <stop offset="100%" stop-color="#4B5E80"/>
    </linearGradient>

    <!-- Precision Crosshair Symbol -->
    <g id="crosshair-dark">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#C5A059" stroke-width="0.75" opacity="0.7"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#C5A059" stroke-width="0.75" opacity="0.7"/>
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="#C5A059" stroke-width="0.5" opacity="0.9"/>
    </g>

    <g id="node-point-dark">
      <circle cx="0" cy="0" r="2" fill="#E5C07B"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#C5A059" stroke-width="0.5" opacity="0.5">
        <animate attributeName="r" values="3;7;3" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif; }
    .gold { fill: #C5A059; }
    .white { fill: #F4F5F8; }
    .muted { fill: #828B9E; }
    .faint { fill: #4B5568; }
  </style>

  <!-- Background Surface -->
  <rect width="920" height="380" fill="#08090C" rx="4"/>
  <rect width="920" height="380" fill="url(#grid-pattern-dark)" opacity="0.75"/>

  <!-- Outer Architectural Framing -->
  <rect x="30" y="24" width="860" height="332" fill="none" stroke="#1E2433" stroke-width="0.75"/>
  <rect x="34" y="28" width="852" height="324" fill="none" stroke="#121622" stroke-width="0.5"/>

  <!-- Precision Corner Crosshairs -->
  <use href="#crosshair-dark" x="30" y="24"/>
  <use href="#crosshair-dark" x="890" y="24"/>
  <use href="#crosshair-dark" x="30" y="356"/>
  <use href="#crosshair-dark" x="890" y="356"/>

  <!-- Coordinate Header Marginalia -->
  <g class="mono" font-size="8.5" letter-spacing="1.5">
    <text x="50" y="46" class="gold">SYS // COORD: 19.0760° N, 72.8777° E</text>
    <text x="460" y="46" class="faint" text-anchor="middle">TRANSFORMATION ENGINE: 2D LINEAR MAP T(v) = Av</text>
    <text x="870" y="46" class="gold" text-anchor="end">DET(A) = 1.000 // ORTHOGONAL</text>
  </g>

  <!-- Top Technical Datum Line with Animated Traveling Pulse -->
  <line x1="50" y1="56" x2="870" y2="56" stroke="#1E2638" stroke-width="0.75"/>
  <line x1="50" y1="56" x2="200" y2="56" stroke="url(#beam-grad-dark)" stroke-width="1.5">
    <animate attributeName="x1" values="50;720;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="200;870;200" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- LEFT GEOMETRIC SUITE: Dynamic Coordinate Transformation -->
  <g transform="translate(130, 200)">
    <!-- Local coordinate axes -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#222B3D" stroke-width="0.75"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#222B3D" stroke-width="0.75"/>

    <!-- Ticks -->
    <line x1="35" y1="-3" x2="35" y2="3" stroke="#333E54" stroke-width="0.5"/>
    <line x1="-35" y1="-3" x2="-35" y2="3" stroke="#333E54" stroke-width="0.5"/>
    <line x1="-3" y1="35" x2="3" y2="35" stroke="#333E54" stroke-width="0.5"/>
    <line x1="-3" y1="-35" x2="3" y2="-35" stroke="#333E54" stroke-width="0.5"/>

    <!-- Unit Circle Projection Reference -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#192233" stroke-width="0.5" stroke-dasharray="2 3"/>

    <!-- Basis Vector e1 rotating into v1 (animated rotation) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0; 45; 0; -30; 0" dur="12s" repeatCount="indefinite" ease="ease-in-out"/>
      
      <!-- Transformed Basis Vector 1 -->
      <line x1="0" y1="0" x2="50" y2="0" stroke="#C5A059" stroke-width="1.25"/>
      <polygon points="52,0 46,-2.5 46,2.5" fill="#E5C07B"/>
      
      <!-- Orthogonal Transformed Basis Vector 2 -->
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#7E97C4" stroke-width="1.25"/>
      <polygon points="0,-52 -2.5,-46 2.5,-46" fill="#7E97C4"/>

      <!-- Transformed Sub-space Polygon (Sheared/Rotated Square) -->
      <polygon points="0,0 50,0 50,-50 0,-50" fill="#C5A059" fill-opacity="0.04" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="2 2"/>
    </g>

    <!-- Angle Sweep Arc -->
    <path d="M 30,0 A 30 30 0 0 0 21,-21" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="1 2"/>

    <!-- Coordinate Center Marker -->
    <circle cx="0" cy="0" r="2.5" fill="#E5C07B"/>
    <text x="-68" y="-76" class="mono" font-size="7.5" fill="#6B7894">V[t] = R(θ)·v₀</text>
    <text x="56" y="8" class="mono" font-size="7" fill="#C5A059">e₁</text>
    <text x="5" y="-56" class="mono" font-size="7" fill="#7E97C4">e₂</text>
  </g>

  <!-- RIGHT GEOMETRIC SUITE: Matrix Kernel & Eigen-lattice -->
  <g transform="translate(790, 200)">
    <!-- 3x3 Discrete Coordinate Lattice -->
    <g stroke="#1F283B" stroke-width="0.5">
      <line x1="-50" y1="-50" x2="50" y2="-50"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-50" y1="50" x2="50" y2="50"/>
      <line x1="-50" y1="-50" x2="-50" y2="50"/>
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="50" y1="-50" x2="50" y2="50"/>
    </g>

    <!-- Dynamic Diagonal Eigenvector Vector Projection -->
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="3 3"/>
    
    <!-- Matrix Bracket Geometry -->
    <path d="M -62,-55 L -68,-55 L -68,55 L -62,55" fill="none" stroke="#7E97C4" stroke-width="1"/>
    <path d="M 62,-55 L 68,-55 L 68,55 L 62,55" fill="none" stroke="#7E97C4" stroke-width="1"/>

    <!-- Lattice Nodes with Staggered Pulse -->
    <circle cx="-50" cy="-50" r="1.5" fill="#4B5568"/>
    <circle cx="0" cy="-50" r="1.5" fill="#4B5568"/>
    <circle cx="50" cy="-50" r="1.5" fill="#C5A059"/>
    <circle cx="-50" cy="0" r="1.5" fill="#4B5568"/>
    <use href="#node-point-dark" x="0" y="0"/>
    <circle cx="50" cy="0" r="1.5" fill="#4B5568"/>
    <circle cx="-50" cy="50" r="1.5" fill="#C5A059"/>
    <circle cx="0" cy="50" r="1.5" fill="#4B5568"/>
    <circle cx="50" cy="50" r="1.5" fill="#4B5568"/>

    <!-- Animated Scanning Ellipse around Eigen-axis -->
    <ellipse cx="0" cy="0" rx="45" ry="18" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="45; 225; 45" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <text x="0" y="-68" class="mono" font-size="7.5" fill="#6B7894" text-anchor="middle">KER(A) ⊥ IM(Aᵀ)</text>
    <text x="0" y="76" class="mono" font-size="7.5" fill="#C5A059" text-anchor="middle">λ₁λ₂ = det(A)</text>
  </g>

  <!-- CENTER CORE: THE ENGINEERED IDENTITY -->
  <!-- Architectural Identity Bounding Enclosure -->
  <rect x="230" y="86" width="460" height="228" fill="#0C0E14" fill-opacity="0.85" stroke="#1F283C" stroke-width="0.75" rx="2"/>
  <line x1="230" y1="86" x2="250" y2="86" stroke="#C5A059" stroke-width="2"/>
  <line x1="230" y1="86" x2="230" y2="106" stroke="#C5A059" stroke-width="2"/>
  <line x1="690" y1="314" x2="670" y2="314" stroke="#C5A059" stroke-width="2"/>
  <line x1="690" y1="314" x2="690" y2="294" stroke="#C5A059" stroke-width="2"/>

  <!-- Identity Sub-classification Badge -->
  <g transform="translate(460, 114)">
    <rect x="-135" y="-12" width="270" height="20" fill="#131722" stroke="#263147" stroke-width="0.5" rx="10"/>
    <circle cx="-118" cy="-2" r="3" fill="#E5C07B">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-106" y="2" class="mono" font-size="8.5" fill="#C5A059" letter-spacing="1.5">AUTHENTIC IDENTITY // ENG.STUDIO</text>
  </g>

  <!-- PRIMARY NAME TYPOGRAPHY -->
  <text x="460" y="172" class="sans" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="9">
    ISA SHAIKH
  </text>

  <!-- Accent Divider with Central Geometric Rhombus -->
  <g transform="translate(460, 192)">
    <line x1="-180" y1="0" x2="-14" y2="0" stroke="#2B364D" stroke-width="0.75"/>
    <line x1="14" y1="0" x2="180" y2="0" stroke="#2B364D" stroke-width="0.75"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#C5A059"/>
    <circle cx="-60" cy="0" r="1.25" fill="#4B5568"/>
    <circle cx="60" cy="0" r="1.25" fill="#4B5568"/>
  </g>

  <!-- CORE PHILOSOPHY / SIGNATURE HEADLINE -->
  <text x="460" y="222" class="sans" font-size="12.5" font-weight="500" fill="#E2E5EB" text-anchor="middle" letter-spacing="1.2">
    Mathematics shapes how I think. Engineering shapes what I build.
  </text>

  <!-- MANDATORY THREE-PART POSITIONING PILLARS -->
  <g class="mono" font-size="9.5" text-anchor="middle" letter-spacing="1">
    <text x="460" y="254">
      <tspan fill="#C5A059">ENGINEERING STUDENT</tspan>
      <tspan fill="#4B5568"> · </tspan>
      <tspan fill="#FFFFFF">MATHEMATICS ENTHUSIAST</tspan>
      <tspan fill="#4B5568"> · </tspan>
      <tspan fill="#C5A059">SOFTWARE DEVELOPER</tspan>
    </text>
  </g>

  <!-- STUDIO ATTRIBUTION -->
  <g class="mono" font-size="8.5" fill="#7E8B9E" text-anchor="middle" letter-spacing="1.5">
    <text x="460" y="284">ELYARO LABS — INDEPENDENT ANDROID PRODUCT STUDIO</text>
  </g>

  <!-- Bottom Technical Footer Bar inside Frame -->
  <line x1="50" y1="328" x2="870" y2="328" stroke="#1E2638" stroke-width="0.75"/>
  <g class="mono" font-size="8" fill="#5A667E" letter-spacing="1.2">
    <text x="50" y="344">STACK // FLUTTER · DART · SPRING BOOT · SYSTEM ARCHITECTURE</text>
    <text x="870" y="344" text-anchor="end" fill="#C5A059">DISCIPLINE: DETERMINISTIC &amp; ON-DEVICE</text>
  </g>
</svg>
