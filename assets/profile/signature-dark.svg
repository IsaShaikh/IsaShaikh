<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" fill="none">
  <defs>
    <linearGradient id="sig-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#2a2a2a"/>
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  
  <!-- Top line -->
  <line x1="150" y1="20" x2="750" y2="20" stroke="url(#sig-g)" stroke-width="0.5"/>
  
  <!-- Geometric monogram: angular 'I S' -->
  <g transform="translate(420, 40)">
    <!-- Minimal geometric mark -->
    <rect x="0" y="0" width="2" height="30" fill="#555"/>
    <rect x="12" y="0" width="18" height="2" fill="#555"/>
    <rect x="12" y="14" width="14" height="2" fill="#555"/>
    <rect x="16" y="28" width="14" height="2" fill="#555"/>
    <rect x="38" y="0" width="2" height="14" fill="#555"/>
    <rect x="24" y="16" width="2" height="14" fill="#555"/>
  </g>
  
  <!-- Studio name -->
  <text x="450" y="95" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="8" fill="#444" text-anchor="middle" letter-spacing="6">ELYARO LABS</text>
  
  <!-- Bottom line -->
  <line x1="150" y1="110" x2="750" y2="110" stroke="url(#sig-g)" stroke-width="0.5"/>
  
  <!-- Subtle pulse on the monogram -->
  <rect x="418" y="38" width="44" height="34" fill="none" stroke="#333" stroke-width="0.3" rx="2" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
