<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 46" width="156" height="46" fill="none">
  <!-- Button Container -->
  <rect x="0.5" y="0.5" width="155" height="45" rx="7" fill="#0A0C10" stroke="#2B354A" stroke-width="1"/>
  
  <!-- Google Play Official Triangle Logo -->
  <g transform="translate(14, 11) scale(0.95)">
    <!-- Blue/Cyan wing -->
    <path d="M 1.5,1.2 L 14.5,13.5 L 1.5,25.8 C 1.2,25.4 1,24.8 1,24 L 1,3 C 1,2.2 1.2,1.6 1.5,1.2 Z" fill="#00E676"/>
    <path d="M 1.5,1.2 L 14.5,13.5 L 1.5,25.8 C 1.2,25.4 1,24.8 1,24 L 1,3 C 1,2.2 1.2,1.6 1.5,1.2 Z" fill="#00D2FF"/>
    
    <!-- Red/Orange top wing -->
    <path d="M 19.5,8.8 L 14.5,13.5 L 1.5,1.2 C 2.1,0.5 3.1,0.1 4.2,0.7 L 19.5,8.8 Z" fill="#FF3D00"/>
    
    <!-- Yellow right point -->
    <path d="M 23.5,11.2 C 24.8,11.9 24.8,13.1 23.5,13.8 L 19.5,16.2 L 14.5,11.5 L 19.5,6.8 L 23.5,9.2 Z" fill="#FFC107"/>
    
    <!-- Green/Blue bottom wing -->
    <path d="M 1.5,23.8 L 14.5,11.5 L 19.5,16.2 L 4.2,24.3 C 3.1,24.9 2.1,24.5 1.5,23.8 Z" fill="#00E676"/>
  </g>

  <!-- Typography -->
  <text x="48" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="500" fill="#9BA5B8" letter-spacing="1">GET IT ON</text>
  <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">Google Play</text>
</svg>
