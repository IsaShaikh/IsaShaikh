<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="math-flow-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#E5C07B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7E97C4" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Enclosure -->
  <rect width="920" height="180" fill="#0A0C11" stroke="#1D2436" stroke-width="0.75" rx="3"/>
  <rect x="2" y="2" width="916" height="176" fill="none" stroke="#111624" stroke-width="0.5" rx="2"/>

  <!-- Header Coordinate Marginalia -->
  <g class="mono" font-size="8" letter-spacing="1.5">
    <text x="30" y="24" fill="#C5A059">CORE PARADIGM // MATHEMATICS ⟶ LOGIC ⟶ SHIPPED SOFTWARE</text>
    <text x="890" y="24" fill="#6B7894" text-anchor="end">DETERMINISTIC INVARIANTS // LOCAL-FIRST</text>
  </g>
  <line x1="30" y1="32" x2="890" y2="32" stroke="#1B2233" stroke-width="0.5"/>

  <!-- Three Connected Pillars -->
  <!-- 01: Mathematical Foundation -->
  <g transform="translate(40, 48)">
    <rect width="260" height="110" fill="#0E121B" stroke="#222B3D" stroke-width="0.75" rx="2"/>
    <text x="16" y="22" class="mono" font-size="8" fill="#C5A059" letter-spacing="1.5">STAGE 01 // MATHEMATICS</text>
    <text x="16" y="44" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">Linear Operators &amp; Invariants</text>
    <text x="16" y="66" class="mono" font-size="10" fill="#E5C07B">y = Ax + b  ·  det(A) ≠ 0</text>
    <text x="16" y="86" class="mono" font-size="7.5" fill="#8E99AF">Exact rational fields ℚ, affine mappings,</text>
    <text x="16" y="98" class="mono" font-size="7.5" fill="#8E99AF">and formal mathematical structure.</text>
  </g>

  <!-- Transition Arrow 1 -> 2 with Animated Traveling Energy Point -->
  <g transform="translate(305, 103)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#33415C" stroke-width="1.5"/>
    <polygon points="30,0 24,-3 24,3" fill="#C5A059"/>
    <circle cx="0" cy="0" r="2.5" fill="#E5C07B">
      <animate attributeName="cx" values="0;30;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 02: Algorithmic Logic -->
  <g transform="translate(340, 48)">
    <rect width="260" height="110" fill="#0E121B" stroke="#222B3D" stroke-width="0.75" rx="2"/>
    <text x="16" y="22" class="mono" font-size="8" fill="#7E97C4" letter-spacing="1.5">STAGE 02 // LOGIC &amp; ARCHITECTURE</text>
    <text x="16" y="44" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">Deterministic Derivations</text>
    <text x="16" y="66" class="mono" font-size="10" fill="#7E97C4">A⁻¹ = adj(A) / det(A)</text>
    <text x="16" y="86" class="mono" font-size="7.5" fill="#8E99AF">Stepwise cofactor elimination,</text>
    <text x="16" y="98" class="mono" font-size="7.5" fill="#8E99AF">zero floating-point drift, O(n³) bounds.</text>
  </g>

  <!-- Transition Arrow 2 -> 3 -->
  <g transform="translate(605, 103)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#33415C" stroke-width="1.5"/>
    <polygon points="30,0 24,-3 24,3" fill="#7E97C4"/>
    <circle cx="0" cy="0" r="2.5" fill="#7E97C4">
      <animate attributeName="cx" values="0;30;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- 03: Shipped Mobile Software -->
  <g transform="translate(640, 48)">
    <rect width="240" height="110" fill="#0E121B" stroke="#222B3D" stroke-width="0.75" rx="2"/>
    <text x="16" y="22" class="mono" font-size="8" fill="#E5C07B" letter-spacing="1.5">STAGE 03 // DEPLOYED PRODUCT</text>
    <text x="16" y="44" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">PacePDF · MathSheet · MatrixLab</text>
    <text x="16" y="66" class="mono" font-size="9.5" fill="#C5A059">Flutter · Dart · Local Android OS</text>
    <text x="16" y="86" class="mono" font-size="7.5" fill="#8E99AF">Zero cloud latency, 100% on-device,</text>
    <text x="16" y="98" class="mono" font-size="7.5" fill="#8E99AF">deliberate tools shipped to users.</text>
  </g>
</svg>
