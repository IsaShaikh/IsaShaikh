  <line x1="150" y1="110" x2="750" y2="110" stroke="url(#sig-gl)" stroke-width="0.5"/>
  
  <rect x="418" y="38" width="44" height="34" fill="none" stroke="#bbb" stroke-width="0.3" rx="2" opacity="0">
